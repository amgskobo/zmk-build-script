name: Self-hosted Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Self-hosted platform to run
        required: true
        type: choice
        options: [macos, windows, linux, all]
        default: macos
      mode:
        description: Validate contracts or also build firmware
        required: true
        type: choice
        options: [validate, build]
        default: validate
      pristine:
        description: Reset the dedicated test cache before the standard build
        required: true
        type: boolean
        default: true
      build_image:
        description: Optional image name or digest; blank preserves runner environment and builder defaults
        required: false
        type: string
        default: ''
      docker_platform:
        description: Optional Docker platform; blank preserves runner environment and Docker defaults
        required: false
        type: string
        default: ''
      target_jobs:
        description: Optional parallel target count; blank preserves runner environment and builder defaults
        required: false
        type: string
        default: ''
      compiler_jobs:
        description: Optional compiler jobs per target; blank preserves runner environment and build-image defaults
        required: false
        type: string
        default: ''
      test_jobs:
        description: Optional concurrent test case count (1-16); blank preserves runner environment or the default
        required: false
        type: string
        default: ''
      profile:
        description: Record private case timings and publish fixed numeric latency aggregates
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  BUILD_MODE: ${{ inputs.mode }}
  ZMK_TEST_PRISTINE: ${{ inputs.pristine && '1' || '0' }}
  BUILD_IMAGE_INPUT: ${{ inputs.build_image }}
  DOCKER_PLATFORM_INPUT: ${{ inputs.docker_platform }}
  TARGET_JOBS_INPUT: ${{ inputs.target_jobs }}
  COMPILER_JOBS_INPUT: ${{ inputs.compiler_jobs }}
  TEST_JOBS_INPUT: ${{ inputs.test_jobs }}
  ZMK_TEST_PROFILE: ${{ inputs.profile && '1' || '0' }}

jobs:
  macos:
    name: macOS self-hosted verification
    if: ${{ inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: [self-hosted, macOS, zmk-docker, zmk-docker-active]
    timeout-minutes: 180
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v6
      - name: Initialize publication reports
        id: publication-init
        run: bash .github/scripts/check-build-output.sh publish clear
      - name: Check Docker access
        run: bash .github/scripts/check-build-output.sh ci-tools
      - name: Verify shell and Docker contracts
        run: |
          if [ -n "${BUILD_IMAGE_INPUT}" ]; then export ZMK_BUILD_IMAGE="${BUILD_IMAGE_INPUT}"; fi
          if [ -n "${DOCKER_PLATFORM_INPUT}" ]; then export ZMK_DOCKER_PLATFORM="${DOCKER_PLATFORM_INPUT}"; fi
          if [ -n "${TARGET_JOBS_INPUT}" ]; then export ZMK_BUILD_JOBS="${TARGET_JOBS_INPUT}"; fi
          if [ -n "${COMPILER_JOBS_INPUT}" ]; then export CMAKE_BUILD_PARALLEL_LEVEL="${COMPILER_JOBS_INPUT}"; fi
          if [ -n "${TEST_JOBS_INPUT}" ]; then export ZMK_TEST_JOBS="${TEST_JOBS_INPUT}"; fi
          if [ "${BUILD_MODE}" = build ]; then
            bash .github/scripts/check-build-output.sh ci-tests all
          else
            bash .github/scripts/check-build-output.sh ci-tests shell
            bash .github/scripts/check-build-output.sh ci-tests docker
          fi
      - name: Preserve private evidence
        if: always()
        run: bash .github/scripts/check-build-output.sh ci-archive
      - name: Verify publication payload
        id: publication-check
        if: always()
        run: bash .github/scripts/check-build-output.sh publish verify
      - name: Upload publication reports
        if: ${{ always() && steps.publication-init.outcome == 'success' && steps.publication-check.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: zmk-self-hosted-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .build/public/tests-shell.txt
            .build/public/tests-docker.txt
            .build/public/tests-all.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Windows self-hosted verification
    if: ${{ inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: [self-hosted, Windows, zmk-docker, zmk-docker-active]
    timeout-minutes: 180
    defaults:
      run:
        shell: C:\Progra~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v6
      - name: Initialize publication reports
        id: publication-init
        run: bash .github/scripts/check-build-output.sh publish clear
      - name: Check Docker access
        run: bash .github/scripts/check-build-output.sh ci-tools
      - name: Verify shell and Docker contracts
        run: |
          if [ -n "${BUILD_IMAGE_INPUT}" ]; then export ZMK_BUILD_IMAGE="${BUILD_IMAGE_INPUT}"; fi
          if [ -n "${DOCKER_PLATFORM_INPUT}" ]; then export ZMK_DOCKER_PLATFORM="${DOCKER_PLATFORM_INPUT}"; fi
          if [ -n "${TARGET_JOBS_INPUT}" ]; then export ZMK_BUILD_JOBS="${TARGET_JOBS_INPUT}"; fi
          if [ -n "${COMPILER_JOBS_INPUT}" ]; then export CMAKE_BUILD_PARALLEL_LEVEL="${COMPILER_JOBS_INPUT}"; fi
          if [ -n "${TEST_JOBS_INPUT}" ]; then export ZMK_TEST_JOBS="${TEST_JOBS_INPUT}"; fi
          if [ "${BUILD_MODE}" = build ]; then
            bash .github/scripts/check-build-output.sh ci-tests all
          else
            bash .github/scripts/check-build-output.sh ci-tests shell
            bash .github/scripts/check-build-output.sh ci-tests docker
          fi
      - name: Preserve private evidence
        if: always()
        run: bash .github/scripts/check-build-output.sh ci-archive
      - name: Verify publication payload
        id: publication-check
        if: always()
        run: bash .github/scripts/check-build-output.sh publish verify
      - name: Upload publication reports
        if: ${{ always() && steps.publication-init.outcome == 'success' && steps.publication-check.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: zmk-self-hosted-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .build/public/tests-shell.txt
            .build/public/tests-docker.txt
            .build/public/tests-all.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  linux:
    name: Linux self-hosted verification
    if: ${{ inputs.platform == 'all' || inputs.platform == 'linux' }}
    runs-on: [self-hosted, Linux, zmk-docker, zmk-docker-active]
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Initialize publication reports
        id: publication-init
        run: bash .github/scripts/check-build-output.sh publish clear
      - name: Check Docker access
        run: bash .github/scripts/check-build-output.sh ci-tools
      - name: Verify shell and Docker contracts
        run: |
          if [ -n "${BUILD_IMAGE_INPUT}" ]; then export ZMK_BUILD_IMAGE="${BUILD_IMAGE_INPUT}"; fi
          if [ -n "${DOCKER_PLATFORM_INPUT}" ]; then export ZMK_DOCKER_PLATFORM="${DOCKER_PLATFORM_INPUT}"; fi
          if [ -n "${TARGET_JOBS_INPUT}" ]; then export ZMK_BUILD_JOBS="${TARGET_JOBS_INPUT}"; fi
          if [ -n "${COMPILER_JOBS_INPUT}" ]; then export CMAKE_BUILD_PARALLEL_LEVEL="${COMPILER_JOBS_INPUT}"; fi
          if [ -n "${TEST_JOBS_INPUT}" ]; then export ZMK_TEST_JOBS="${TEST_JOBS_INPUT}"; fi
          if [ "${BUILD_MODE}" = build ]; then
            bash .github/scripts/check-build-output.sh ci-tests all
          else
            bash .github/scripts/check-build-output.sh ci-tests shell
            bash .github/scripts/check-build-output.sh ci-tests docker
          fi
      - name: Preserve private evidence
        if: always()
        run: bash .github/scripts/check-build-output.sh ci-archive
      - name: Verify publication payload
        id: publication-check
        if: always()
        run: bash .github/scripts/check-build-output.sh publish verify
      - name: Upload publication reports
        if: ${{ always() && steps.publication-init.outcome == 'success' && steps.publication-check.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: zmk-self-hosted-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .build/public/tests-shell.txt
            .build/public/tests-docker.txt
            .build/public/tests-all.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
