name: Self-hosted Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Self-hosted platform to run
        required: true
        type: choice
        options: [macos, windows, linux, all]
        default: macos
      mode:
        description: Validate contracts or also build firmware
        required: true
        type: choice
        options: [validate, build]
        default: validate
      pristine:
        description: Reset the dedicated test cache before the standard build
        required: true
        type: boolean
        default: true

permissions:
  contents: read

env:
  BUILD_MODE: ${{ inputs.mode }}
  ZMK_TEST_PRISTINE: ${{ inputs.pristine && '1' || '0' }}

jobs:
  macos:
    name: macOS self-hosted verification
    if: ${{ inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: [self-hosted, macOS, zmk-docker, zmk-docker-active]
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Initialize publication reports
        id: publication-init
        run: bash .github/scripts/check-build-output.sh publish clear
      - name: Verify shell and Docker contracts
        run: |
          if [ "${BUILD_MODE}" = build ]; then
            bash .github/scripts/check-build-output.sh ci-tests all
          else
            bash .github/scripts/check-build-output.sh ci-tests shell
            bash .github/scripts/check-build-output.sh ci-tests docker
          fi
      - name: Verify publication payload
        id: publication-check
        if: always()
        run: bash .github/scripts/check-build-output.sh publish verify
      - name: Upload publication reports
        if: ${{ always() && steps.publication-init.outcome == 'success' && steps.publication-check.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: zmk-self-hosted-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .build/public/tests-shell.txt
            .build/public/tests-docker.txt
            .build/public/tests-all.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Windows self-hosted verification
    if: ${{ inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: [self-hosted, Windows, zmk-docker, zmk-docker-active]
    timeout-minutes: 180
    defaults:
      run:
        shell: C:\Progra~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v6
      - name: Initialize publication reports
        id: publication-init
        run: bash .github/scripts/check-build-output.sh publish clear
      - name: Verify shell and Docker contracts
        run: |
          if [ "${BUILD_MODE}" = build ]; then
            bash .github/scripts/check-build-output.sh ci-tests all
          else
            bash .github/scripts/check-build-output.sh ci-tests shell
            bash .github/scripts/check-build-output.sh ci-tests docker
          fi
      - name: Verify publication payload
        id: publication-check
        if: always()
        run: bash .github/scripts/check-build-output.sh publish verify
      - name: Upload publication reports
        if: ${{ always() && steps.publication-init.outcome == 'success' && steps.publication-check.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: zmk-self-hosted-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .build/public/tests-shell.txt
            .build/public/tests-docker.txt
            .build/public/tests-all.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  linux:
    name: Linux self-hosted verification
    if: ${{ inputs.platform == 'all' || inputs.platform == 'linux' }}
    runs-on: [self-hosted, Linux, zmk-docker, zmk-docker-active]
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Initialize publication reports
        id: publication-init
        run: bash .github/scripts/check-build-output.sh publish clear
      - name: Verify shell and Docker contracts
        run: |
          if [ "${BUILD_MODE}" = build ]; then
            bash .github/scripts/check-build-output.sh ci-tests all
          else
            bash .github/scripts/check-build-output.sh ci-tests shell
            bash .github/scripts/check-build-output.sh ci-tests docker
          fi
      - name: Verify publication payload
        id: publication-check
        if: always()
        run: bash .github/scripts/check-build-output.sh publish verify
      - name: Upload publication reports
        if: ${{ always() && steps.publication-init.outcome == 'success' && steps.publication-check.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: zmk-self-hosted-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .build/public/tests-shell.txt
            .build/public/tests-docker.txt
            .build/public/tests-all.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
