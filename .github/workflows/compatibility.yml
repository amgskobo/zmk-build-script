name: Compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    name: Shell compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Verify shell contracts
        run: bash .github/scripts/test.sh shell
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shell-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/test-*/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  docker:
    name: Docker contracts and firmware
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Verify copy, parser and cache contracts
        run: bash .github/scripts/test.sh docker
      - name: Verify build, module overlays and restoration
        run: bash .github/scripts/test.sh build
      - name: Upload test evidence and firmware
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zmk-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .build/test-*/**
            .build/run-*/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
