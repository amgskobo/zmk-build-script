name: Auto Build External ZMK Repos

on:
  workflow_dispatch:
    inputs:
      source_file:
        description: Source list file to resolve.
        required: true
        type: string
        default: repos.txt
      mode:
        description: Run validate only or full firmware builds.
        required: true
        type: choice
        options: [build, validate]
        default: build
      build_jobs:
        description: Target-level parallelism inside each source build.
        required: true
        type: choice
        options: ["1", "2", "3", "4"]
        default: "1"
      source_jobs:
        description: Maximum source matrix jobs to run at once.
        required: true
        type: choice
        options: ["1", "2", "3", "4", "6", "8", "12", "16"]
        default: "4"
      pristine:
        description: Reset each source cache before build or validation.
        required: true
        type: boolean
        default: true
  schedule:
    # GitHub Actions schedules use UTC cron only; do not add a timezone key.
    # 00:13 UTC = 09:13 JST.
    - cron: "13 0 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: zmk-external-auto-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXTERNAL_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'build' }}
  EXTERNAL_BUILD_JOBS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_jobs || '1' }}
  EXTERNAL_SOURCE_JOBS: ${{ github.event.inputs.source_jobs || '4' }}
  EXTERNAL_PRISTINE: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.pristine == 'true' }}

jobs:
  sources:
    name: Resolve source list
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - name: Prepare private source selector
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            fs.mkdirSync('.build', {recursive: true});
            fs.writeFileSync('.build/ci-source-file', context.payload.inputs?.source_file || 'repos.txt');

      - name: Resolve source indices
        id: resolve
        shell: bash
        run: bash .github/scripts/check-build-output.sh ci-matrix

  build-runner:
    name: Source ${{ matrix.source.index }}
    needs: sources
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(github.event.inputs.source_jobs || '4') }}
      matrix:
        source: ${{ fromJSON(needs.sources.outputs.matrix).include }}
    runs-on: [self-hosted, zmk-docker, zmk-docker-active]
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v6

      - name: Initialize publication reports
        id: publication-init-unix
        shell: bash
        if: ${{ runner.os != 'Windows' }}
        run: bash .github/scripts/check-build-output.sh publish clear

      - name: Initialize publication reports (Windows)
        id: publication-init-windows
        if: ${{ runner.os == 'Windows' }}
        shell: C:\Progra~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}
        run: bash .github/scripts/check-build-output.sh publish clear

      - name: Prepare private source selector
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            fs.mkdirSync('.build', {recursive: true});
            fs.writeFileSync('.build/ci-source-file', context.payload.inputs?.source_file || 'repos.txt');

      - name: Show selected runner (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        env:
          SELECTED_RUNNER_OS: ${{ runner.os }}
          SELECTED_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          {
            echo "## Selected runner"
            echo
            echo "- runner.os: \`${SELECTED_RUNNER_OS}\`"
            echo "- runner.arch: \`${SELECTED_RUNNER_ARCH}\`"
            echo
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Show selected runner (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: C:\Progra~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}
        env:
          SELECTED_RUNNER_OS: ${{ runner.os }}
          SELECTED_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          {
            echo "## Selected runner"
            echo
            echo "- runner.os: \`${SELECTED_RUNNER_OS}\`"
            echo "- runner.arch: \`${SELECTED_RUNNER_ARCH}\`"
            echo
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Check LF checkout (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: bash .github/scripts/check-build-output.sh ci-lf

      - name: Check LF checkout (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: C:\Progra~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}
        run: bash .github/scripts/check-build-output.sh ci-lf

      - name: Check runner tools (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: bash .github/scripts/check-build-output.sh ci-tools

      - name: Check runner tools (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: C:\Progra~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}
        run: bash .github/scripts/check-build-output.sh ci-tools

      - name: Check Bash syntax (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: bash .github/scripts/check-build-output.sh ci-syntax

      - name: Check Bash syntax (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: C:\Progra~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}
        run: bash .github/scripts/check-build-output.sh ci-syntax

      - name: Build source (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        env:
          SOURCE_INDEX: ${{ matrix.source.index }}
        run: bash .github/scripts/check-build-output.sh ci-source-index "${SOURCE_INDEX}"

      - name: Build source (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: C:\Progra~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}
        env:
          SOURCE_INDEX: ${{ matrix.source.index }}
        run: bash .github/scripts/check-build-output.sh ci-source-index "${SOURCE_INDEX}"

      - name: Check build output (Unix)
        if: ${{ runner.os != 'Windows' && always() }}
        shell: bash
        run: bash .github/scripts/check-build-output.sh ci-check "${EXTERNAL_MODE}"

      - name: Check build output (Windows)
        if: ${{ runner.os == 'Windows' && always() }}
        shell: C:\Progra~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}
        run: bash .github/scripts/check-build-output.sh ci-check "${EXTERNAL_MODE}"

      - name: Verify publication payload (Unix)
        id: publication-check-unix
        if: ${{ runner.os != 'Windows' && always() }}
        shell: bash
        run: bash .github/scripts/check-build-output.sh publish verify

      - name: Verify publication payload (Windows)
        id: publication-check-windows
        if: ${{ runner.os == 'Windows' && always() }}
        shell: C:\Progra~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}
        run: bash .github/scripts/check-build-output.sh publish verify

      - name: Upload publication reports
        if: ${{ always() && (steps.publication-init-unix.outcome == 'success' || steps.publication-init-windows.outcome == 'success') && (steps.publication-check-unix.outcome == 'success' || steps.publication-check-windows.outcome == 'success') }}
        uses: actions/upload-artifact@v7
        with:
          name: zmk-external-${{ matrix.source.index }}-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .build/public/build.txt
            .build/public/validate.txt
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
